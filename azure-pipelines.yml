# .github/workflows/ci.yml と同じ形の Azure Pipelines 定義。
# 状態: 未検証(Azure DevOps 上ではまだ一度も実行していない)。docs/vcs-provider.md を参照。
#
# 注意: Azure Repos では下の pr: トリガーは無視される。
# PR 検証は main のブランチポリシー「Build validation」にこのパイプラインを登録して行う。

trigger:
  branches:
    include: [main]

pr:
  branches:
    include: [main]

pool:
  vmImage: ubuntu-24.04

variables:
  MISE_VERSION: "2026.11.7"
  # サブディレクトリの mise.toml(backend/ など)も信頼済みとして扱う
  MISE_TRUSTED_CONFIG_PATHS: $(Build.SourcesDirectory)

steps:
  - checkout: self
    # gitleaks が全履歴を検査するため
    fetchDepth: 0
    persistCredentials: false

  - bash: |
      set -euo pipefail
      curl -fsSL https://mise.run | MISE_VERSION="v${MISE_VERSION}" sh
      echo "##vso[task.prependpath]$HOME/.local/bin"
    displayName: Install mise

  - bash: mise run ci
    displayName: mise run ci

  # 計画とテストの照合。計画だけを出すドラフトの PR(ゲート 1)ではテストがまだ無いので流さない。
  # 未検証: ドラフトの判定に System.PullRequest.IsDraft を使う。ドラフトを公開したときに
  # Build validation が流れ直すかは、ブランチポリシーの設定と合わせて移行時に確かめる。
  - bash: |
      set -euo pipefail
      if [[ "${SYSTEM_PULLREQUEST_ISDRAFT:-false}" == "True" || "${SYSTEM_PULLREQUEST_ISDRAFT:-false}" == "true" ]]; then
        echo "ドラフトの PR なので、計画の照合を飛ばします"
        exit 0
      fi
      AIDD_BASE_BRANCH="${SYSTEM_PULLREQUEST_TARGETBRANCH#refs/heads/}" mise run plan:verify-changed
    displayName: mise run plan:verify-changed
    condition: and(succeeded(), eq(variables['Build.Reason'], 'PullRequest'))
