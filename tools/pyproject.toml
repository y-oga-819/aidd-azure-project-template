[project]
name = "aidd-tools"
version = "0.1.0"
description = "開発の進め方を支える補助ツール(テストから仕様一覧を生成し、計画と照合する)"
requires-python = ">=3.13,<3.14"
# 実行時は標準ライブラリだけを使う。pytest プラグインは各コンポーネントの pytest から読み込まれる
dependencies = []

[dependency-groups]
dev = [
  "ruff",
  "mypy",
  "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aidd_spec"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
# テスト名やパラメータを日本語で書く(docs/testing-strategy.md 5 章)ため、
# 全角記号(×、（）など)を紛らわしい文字として扱うルールは外す
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "-ra", "-p", "pytester"]
