[project]
name = "app"
version = "0.1.0"
description = "Backend API(雛形。フレームワーク選定後に置き換える)"
requires-python = ">=3.13,<3.14"
dependencies = []

[dependency-groups]
dev = [
  "ruff",
  "mypy",
  "pytest",
  "pip-audit",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
# E/F: 基本, I: import 順, B: バグの温床, UP: 新しい書き方, S: セキュリティ(bandit 相当), SIM, RUF
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# テストでは assert を使う
"tests/**" = ["S101"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "-ra"]
